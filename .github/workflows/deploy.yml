name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch StarDict data
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.STARDICT_TOKEN }}@github.com/bataak/stardict-data.git" \
            /tmp/stardict-data
          rm -rf /tmp/stardict-data/.git
          mkdir -p public/dict/stardict
          cp -R /tmp/stardict-data/. public/dict/stardict/
          ls -R public/dict/stardict
      - run: npm run build
        env:
          VITE_BASE: /
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
