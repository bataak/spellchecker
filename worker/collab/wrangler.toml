name = "collab"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "collab.bichig.dev", custom_domain = true }]

[triggers]
crons = ["*/10 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://aldaa.bichig.dev,https://soril.bichig.dev,https://soril.bataak.workers.dev,https://aldaa-test.bataak.workers.dev,http://localhost:5173,http://localhost:4173"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[durable_objects.bindings]]
name = "LINKS"
class_name = "Links"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Quota"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Links"]
